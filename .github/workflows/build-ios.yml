name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install autoconf automake cmake libtool m4 ninja pkg-config wget

      - name: Add Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Build SDL2 for iOS (via CMake)
        run: |
          mkdir -p ${{ github.workspace }}/build-ios-libs/Frameworks
          
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-2.30.0.tar.gz
          tar -xzf SDL2-2.30.0.tar.gz
          cd SDL2-2.30.0
          
          mkdir build-ios
          cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DSDL_TEST=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build-ios-libs \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          
          xcodebuild -project SDL2.xcodeproj -scheme SDL2 -configuration Release -sdk iphoneos archive CODE_SIGNING_ALLOWED=NO
          
          # ХИТРОСТЬ: Ищем SDL2.framework везде, где он мог сохраниться, и копируем первый найденный
          find . -name "SDL2.framework" -type d -exec cp -r {} ${{ github.workspace }}/build-ios-libs/Frameworks/ \; -quit

      - name: Build Opus and Opusfile for iOS
        run: |
          wget https://downloads.xiph.org/releases/opus/opus-1.4.tar.gz
          tar -xzf opus-1.4.tar.gz
          cd opus-1.4
          ./configure --host=aarch64-apple-darwin --prefix=${{ github.workspace }}/build-ios-libs
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..
          
          wget https://downloads.xiph.org/releases/opusfile/opusfile-0.12.tar.gz
          tar -xzf opusfile-0.12.tar.gz
          cd opusfile-0.12
          ./configure --host=aarch64-apple-darwin --prefix=${{ github.workspace }}/build-ios-libs --disable-http --disable-examples --disable-doc
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..

      - name: Configure CMake for iOS
        run: |
          mkdir build-ios
          cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DVULKAN=OFF \
            -DSTEAM=OFF \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-ios-libs;${{ github.workspace }}/build-ios-libs/Frameworks" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build with Xcode
        run: |
          cd build-ios
          xcodebuild -project kataris.xcodeproj \
            -scheme kataris \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/kataris.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build-ios/build
          mkdir Payload
          find . -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r kataris.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kataris-iOS-IPA
          path: build-ios/build/kataris.ipa
