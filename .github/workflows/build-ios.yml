name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and iOS libraries via Homebrew
        run: |
          brew install autoconf automake cmake libtool m4 ninja pkg-config
          # Устанавливаем недостающие библиотеки под macOS
          brew install sdl2 opus opusfile libogg freetype libpng sqlite

      - name: Add Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Fix script line endings (CRLF to LF)
        run: |
          find ./scripts -type f -name "*.sh" -exec sed -i '' -e 's/\r$//' {} \;
          chmod -R +x ./scripts/

      - name: Configure CMake for iOS (Direct)
        run: |
          mkdir build-ios
          cd build-ios
          # Передаем CMake пути к библиотекам из Homebrew
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DVULKAN=OFF \
            -DSTEAM=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix opus);$(brew --prefix opusfile);$(brew --prefix libogg);$(brew --prefix freetype);$(brew --prefix libpng);$(brew --prefix sqlite)" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build with Xcode
        run: |
          cd build-ios
          xcodebuild -project kataris.xcodeproj \
            -scheme kataris \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/kataris.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build-ios/build
          mkdir Payload
          find . -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r kataris.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kataris-iOS-IPA
          path: build-ios/build/kataris.ipa
