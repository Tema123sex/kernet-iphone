name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        # Добавили установку opus, opusfile и sdl2
        brew install cmake ninja rust opus opusfile sdl2 pkg-config

    - name: Configure CMake
      run: |
        mkdir build-ios
        cd build-ios
        # Добавили пути, чтобы CMake точно нашел библиотеки, установленные через brew
        cmake .. -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DVULKAN=OFF \
          -DCMAKE_PREFIX_PATH="$(brew --prefix opus);$(brew --prefix opusfile);$(brew --prefix sdl2)" \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

    - name: Build with Xcode
      run: |
        cd build-ios
        xcodebuild -project kataris.xcodeproj \
          -scheme kataris \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/kataris.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        cd build-ios/build
        mkdir Payload
        cp -r kataris.xcarchive/Products/Applications/*.app Payload/
        zip -r kataris.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kataris-ios-ipa
        path: build-ios/build/kataris.ipa
