name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Важно для ddnet-libs и других сабмодулей

    - name: Install dependencies
      run: |
        brew install cmake ninja rust

    - name: Configure CMake
      run: |
        mkdir build-ios
        cd build-ios
        # Генерируем проект Xcode без подписи
        cmake .. -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

    - name: Build with Xcode
      run: |
        cd build-ios
        # Собираем проект. Имя схемы (scheme) обычно совпадает с названием проекта (kataris или TClient)
        # Если сборка упадет с ошибкой "scheme not found", посмотри в Xcode как называется схема, или напиши мне.
        xcodebuild -project kataris.xcodeproj \
          -scheme kataris \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/kataris.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        cd build-ios/build
        mkdir Payload
        # Копируем собранное приложение в папку Payload (стандарт для IPA)
        cp -r kataris.xcarchive/Products/Applications/*.app Payload/
        # Упаковываем в zip и переименовываем в ipa
        zip -r kataris.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kataris-ios-ipa
        path: build-ios/build/kataris.ipa
