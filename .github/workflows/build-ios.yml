name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install autoconf automake cmake libtool m4 ninja pkg-config

      - name: Add Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Fix script line endings (CRLF to LF)
        run: |
          find ./scripts -type f -name "*.sh" -exec sed -i '' -e 's/\r$//' {} \;
          chmod -R +x ./scripts/

      # Мы пропустили шаг Build ddnet-libs, так как скрипт не поддерживает ios
      # и сразу перешли к сборке клиента

      - name: Build kataris for iOS
        run: |
          rm -rf build-ios-client
          # Пробуем запустить скрипт сборки клиента напрямую
          ./scripts/ios/cmake_ios.sh device kataris com.kataris.app Release build-ios-client -DSTEAM=OFF
          echo "=== Ищем собранный .app ==="
          find build-ios-client -name "*.app" -type d

      - name: Verify no libsteam_api link
        run: |
          APP_PATH=$(find build-ios-client -name "kataris.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "kataris.app не найден!"
            exit 1
          fi
          echo "=== Проверка зависимостей бинарника ==="
          otool -L "$APP_PATH/kataris" || true
          echo "=== Проверка Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" || echo "Frameworks пусто — это хорошо"
          if otool -L "$APP_PATH/kataris" | grep -q "libsteam_api"; then
            echo "ВНИМАНИЕ: бинарник всё ещё ссылается на libsteam_api.dylib!"
            exit 1
          fi
          echo "OK: libsteam_api.dylib не линкуется"

      - name: Package IPA with ad-hoc signing
        run: |
          APP_PATH=$(find . -name "kataris.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "kataris.app не найден, ищем любой .app..."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Не найден ни один .app!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Найден: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          echo "=== Ad-hoc подпись ==="
          codesign --force --deep --sign - "Payload/kataris.app"
          echo "=== Создание IPA ==="
          zip -r kataris.ipa Payload
          echo "=== Структура IPA ==="
          unzip -l kataris.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kataris-iOS-IPA
          path: kataris.ipa
