name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install autoconf automake cmake libtool m4 ninja pkg-config

      - name: Add Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Fix script line endings (CRLF to LF)
        run: |
          find ./scripts -type f -name "*.sh" -exec sed -i '' -e 's/\r$//' {} \;
          chmod -R +x ./scripts/

      - name: Configure CMake for iOS (Direct)
        run: |
          mkdir build-ios
          cd build-ios
          # Прямая генерация Xcode проекта без скриптов
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DVULKAN=OFF \
            -DSTEAM=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build with Xcode
        run: |
          cd build-ios
          # Ищем сгенерированный проект. Скорее всего, он называется kataris.xcodeproj
          xcodebuild -project kataris.xcodeproj \
            -scheme kataris \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/kataris.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build-ios/build
          mkdir Payload
          # Ищем .app файл в архиве
          find . -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r kataris.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kataris-iOS-IPA
          path: build-ios/build/kataris.ipa
